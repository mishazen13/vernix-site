<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vernix | Главная</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body>
  <img class="bg-image" src="/assets/bg-nether.svg" alt="Фон Vernix" />
  <img class="cursor-float" data-floater src="/assets/floating-emblem.svg" alt="Летающий эмблема" />
  <header class="topbar">
    <div class="brand">Vernix <span>Network</span></div>
    <nav class="nav-links">
      <a href="/">Главная</a>
      <a href="/rules">Правила</a>
      <a href="/donate">Донат</a>
    </nav>
    <div class="socials">
      <a class="social-btn" href="#" aria-label="Discord">DS</a>
      <a class="social-btn" href="#" aria-label="YouTube">YT</a>
      <a class="social-btn" href="#" aria-label="Telegram">TG</a>
      <a class="social-btn" href="#" aria-label="VK">VK</a>
    </div>
  </header>

  <main class="page-wrap">
    <section class="glass-card hero">
      <h1 id="hero-title">Загрузка...</h1>
      <p id="hero-description"></p>
      <div class="hero-meta">
        <div><strong>IP:</strong> <span id="hero-ip">...</span></div>
        <div><strong>Онлайн:</strong> <span id="hero-online">...</span></div>
      </div>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>

</html>
